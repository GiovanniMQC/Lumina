<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Dashboard estilo Nest Hub para Spotify com letras sincronizadas e clima" />
    <title>TabHub — Spotify Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-wTxAZuxx.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bu3Nxfgp.css">
  </head>
  <body>
    <!-- Fundo dinâmico com capa do álbum em blur -->
    <div id="bg-layer">
      <div id="bg-image"></div>
      <div id="bg-overlay"></div>
      <div id="bg-noise"></div>
    </div>

    <!-- Tela de login -->
    <div id="login-screen" class="screen active">
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </div>
        <h1>TabHub</h1>
        <p>Dashboard Spotify para seu tablet</p>
        <button id="login-btn" class="btn-spotify">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          Entrar com Spotify
        </button>
        <p class="login-hint">Configure seu Client ID em <code>src/auth.ts</code></p>
      </div>
    </div>

    <!-- Tela principal do player (com swipe) -->
    <div id="player-screen" class="screen">

      <!-- Container de swipe horizontal -->
      <div id="swipe-container">

        <!-- ── Página 0: Player Spotify ──────────────────────── -->
        <div class="swipe-page" id="player-page">

          <!-- Tela idle interna (nada tocando) -->
          <div id="idle-overlay" class="idle-overlay">
            <div id="idle-clock">
              <div id="idle-time">--:--</div>
              <div id="idle-date">--- --, ----</div>
            </div>
            <div id="idle-message">
              <span class="idle-dot"></span>
              <span>Nenhuma música tocando</span>
            </div>
          </div>

          <!-- Relógio — canto superior direito -->
          <div id="clock-widget">
            <div id="clock-time">--:--</div>
            <div id="clock-date">--- --, ----</div>
          </div>

          <!-- Área central com info da música -->
          <div id="now-playing">
            <div id="album-art-wrapper">
              <div id="album-art-glow"></div>
              <img id="album-art" src="" alt="Capa do álbum" />
            </div>
            <div id="track-info">
              <div id="track-title">—</div>
              <div id="track-artist">—</div>
              <div id="progress-bar-wrapper">
                <div id="progress-bar">
                  <div id="progress-fill"></div>
                </div>
                <div id="progress-times">
                  <span id="progress-current">0:00</span>
                  <span id="progress-total">0:00</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Letras sincronizadas -->
          <div id="lyrics-container">
            <div id="lyrics-inner"></div>
            <div id="lyrics-gradient-top"></div>
            <div id="lyrics-gradient-bottom"></div>
          </div>

        </div><!-- /player-page -->

        <!-- ── Página 1: Clima ───────────────────────────────── -->
        <div class="swipe-page" id="weather-page">

          <!-- Relógio no canto do clima -->
          <div id="weather-clock-widget">
            <div id="weather-clock-time">--:--</div>
            <div id="weather-clock-date">--- --, ----</div>
          </div>

          <div id="weather-content">

            <!-- Localização + atualização -->
            <div id="weather-header">
              <div id="weather-location-name">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" style="vertical-align:middle;opacity:0.6">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                Obtendo localização...
              </div>
              <div id="weather-updated">--</div>
            </div>

            <!-- Temperatura principal -->
            <div id="weather-main">
              <div id="weather-emoji">🌤️</div>
              <div id="weather-temp-display">--°</div>
              <div id="weather-desc-text">--</div>
            </div>

            <!-- Stats grid -->
            <div id="weather-stats">
              <div class="weather-stat-card">
                <div class="stat-label">Sensação</div>
                <div class="stat-value" id="weather-feels">--°</div>
              </div>
              <div class="weather-stat-card">
                <div class="stat-label">Umidade</div>
                <div class="stat-value" id="weather-humidity">--%</div>
              </div>
              <div class="weather-stat-card">
                <div class="stat-label">Vento</div>
                <div class="stat-value" id="weather-wind">--</div>
              </div>
              <div class="weather-stat-card">
                <div class="stat-label">Máx / Mín</div>
                <div class="stat-value" id="weather-maxmin">-- / --</div>
              </div>
            </div>

            <!-- Previsão horária (scroll horizontal) -->
            <div id="weather-hourly-wrapper">
              <div id="weather-hourly">
                <!-- preenchido pelo weather.ts -->
              </div>
            </div>

          </div>
        </div><!-- /weather-page -->

      </div><!-- /swipe-container -->

      <!-- Indicadores de página -->
      <div id="nav-dots">
        <button class="nav-dot active" data-page="0" aria-label="Player" title="Música"></button>
        <button class="nav-dot"        data-page="1" aria-label="Clima"  title="Clima"></button>
      </div>

    </div><!-- /player-screen -->

    <!-- Botão de tela cheia (global, aparece em todas as telas) -->
    <button id="fullscreen-btn" title="Tela cheia" aria-label="Alternar tela cheia">
      <span class="fs-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </span>
    </button>

  </body>
</html>
