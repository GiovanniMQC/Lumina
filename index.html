<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Dashboard estilo Nest Hub para Spotify com letras sincronizadas" />
    <title>TabHub — Spotify Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Fundo dinâmico com capa do álbum em blur -->
    <div id="bg-layer">
      <div id="bg-image"></div>
      <div id="bg-overlay"></div>
      <div id="bg-noise"></div>
    </div>

    <!-- Tela de login -->
    <div id="login-screen" class="screen active">
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </div>
        <h1>TabHub</h1>
        <p>Dashboard Spotify para seu tablet</p>
        <button id="login-btn" class="btn-spotify">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          Entrar com Spotify
        </button>
        <p class="login-hint">Configure seu Client ID em <code>src/auth.ts</code></p>
      </div>
    </div>

    <!-- Tela principal do player -->
    <div id="player-screen" class="screen">

      <!-- Relógio — canto superior direito -->
      <div id="clock-widget">
        <div id="clock-time">--:--</div>
        <div id="clock-date">--- --, ----</div>
      </div>

      <!-- Área central com info da música -->
      <div id="now-playing">

        <!-- Capa do álbum -->
        <div id="album-art-wrapper">
          <div id="album-art-glow"></div>
          <img id="album-art" src="" alt="Capa do álbum" />
        </div>

        <!-- Info: título + artista -->
        <div id="track-info">
          <div id="track-title">—</div>
          <div id="track-artist">—</div>
          <div id="progress-bar-wrapper">
            <div id="progress-bar">
              <div id="progress-fill"></div>
            </div>
            <div id="progress-times">
              <span id="progress-current">0:00</span>
              <span id="progress-total">0:00</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Letras sincronizadas -->
      <div id="lyrics-container">
        <div id="lyrics-inner">
          <!-- Linhas geradas dinamicamente pelo ui.ts -->
        </div>
        <div id="lyrics-gradient-top"></div>
        <div id="lyrics-gradient-bottom"></div>
      </div>

    </div>

    <!-- Tela idle (nada tocando) -->
    <div id="idle-screen" class="screen">
      <div id="idle-clock">
        <div id="idle-time">--:--</div>
        <div id="idle-date">--- --, ----</div>
      </div>
      <div id="idle-message">
        <span class="idle-dot"></span>
        <span>Nenhuma música tocando</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
