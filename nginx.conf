server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Habilita suporte a variáveis com DNS do Docker (útil se usar nomes de containers, mas IPs diretos também funcionam)
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o Immich (Burla o bloqueio de CORS do navegador)
    location /immich-proxy/ {
        # Responde à verificação de segurança (Preflight/OPTIONS) do navegador imediatamente
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'x-api-key, x-immich-url, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Extrai a URL original (ex: http://192.168.1.50:2283) do cabeçalho que o frontend envia
        set $immich_target $http_x_immich_url;
        
        # Remove o /immich-proxy do início da rota (ex: /immich-proxy/api/albums -> /api/albums)
        rewrite ^/immich-proxy/(.*)$ /$1 break;

        # Oculta informações sensíveis do proxy e injeta CORS na resposta
        proxy_hide_header Access-Control-Allow-Origin;
        add_header 'Access-Control-Allow-Origin' '*' always;

        # Faz a requisição para o servidor do Immich real
        proxy_pass $immich_target;
        
        # Garante que a API Key passe direto
        proxy_set_header x-api-key $http_x_api_key;
    }
}
